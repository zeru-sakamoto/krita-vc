name: Release build

# Manual only: run from the Actions tab (or `gh workflow run release.yml`) when you're ready
# to cut a release. Runs the test suites (Rust, tsc, the plugin self-check), then builds Windows,
# macOS (universal), and Linux and opens a draft GitHub Release with all installers attached for
# review before publishing. Also re-zips the Krita plugin (krita-plugin/kritavc.desktop +
# krita-plugin/kritavc/) fresh from source and attaches it as kritavc-plugin.zip, so the release
# always ships the plugin in sync with the app.
#
# Signing/notarization is intentionally not configured (no certs in this repo yet) — builds
# are unsigned, so macOS shows a Gatekeeper prompt and Windows a SmartScreen prompt on first
# launch. To add signing later, add the relevant secrets and pass them via `env:`/`with:` on
# the tauri-action step below; see https://v2.tauri.app/distribute/sign/.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Nothing gets built or drafted unless the suites pass. Windows only: it's where the artists
  # are and where the engine's platform-specific paths (locking, free space, hidden folders) run.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/checkVersionMap.mjs
      # The app binary embeds dist/ at compile time (tauri::generate_context!), and cargo test
      # builds it, so the frontend has to exist first.
      - run: npx vite build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: python krita-plugin/test_kvc_client.py

  build:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build universal kvc CLI sidecar
        if: matrix.platform == 'macos-latest'
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --bin kvc --target aarch64-apple-darwin
          cargo build --manifest-path src-tauri/Cargo.toml --release --bin kvc --target x86_64-apple-darwin
          mkdir -p src-tauri/target/universal-apple-darwin/release
          lipo -create \
            src-tauri/target/aarch64-apple-darwin/release/kvc \
            src-tauri/target/x86_64-apple-darwin/release/kvc \
            -output src-tauri/target/universal-apple-darwin/release/kvc

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Krita VC v__VERSION__"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Runs once (not once per matrix leg) since all three legs upload to the same
      # release/tag and `zip` isn't reliably available on windows-latest.
      - name: Attach plugin zip to release
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="app-v${VERSION}"
          cd krita-plugin
          zip -r kritavc-plugin.zip kritavc.desktop kritavc
          gh release upload "$TAG" kritavc-plugin.zip --repo zeru-sakamoto/krita-vc --clobber
